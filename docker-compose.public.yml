services:
  arena:
    environment:
      TRUST_PROXY: '1'
      ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - arena
volumes:
  caddy-data:
  caddy-config:
